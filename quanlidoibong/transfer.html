<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển nhượng cầu thủ</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* ===== FORM ===== */
        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        form input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        form input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
        }

        form button {
            grid-column: span 2;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        form button:hover {
            background: #1d4ed8;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #2563eb;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background: #f1f5f9;
        }

        .fee {
            color: #16a34a;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }

            form button {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<h2>🔄 Quản lý chuyển nhượng cầu thủ</h2>

<div class="container">

    <form id="transferForm">
        <input type="text" placeholder="Tên cầu thủ" id="player" required>
        <input type="text" placeholder="Đội cũ" id="fromTeam" required>
        <input type="text" placeholder="Đội mới" id="toTeam" required>
        <input type="date" id="date" required>
        <input type="number" placeholder="Phí chuyển nhượng ($)" id="fee">
        <button type="submit">➕ Thêm chuyển nhượng</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Cầu thủ</th>
                <th>Đội cũ</th>
                <th>Đội mới</th>
                <th>Ngày</th>
                <th>Phí</th>
            </tr>
        </thead>
        <tbody id="transferTable"></tbody>
    </table>

</div>

<script src="transfer.js"></script>
</body>
</html>
