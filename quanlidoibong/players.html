<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Quản Lý Cầu Thủ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/vi/thumb/1/1d/Manchester_City_FC_logo.svg/1024px-Manchester_City_FC_logo.svg.png"
</head>
<body>
  <header><h1>⚽ Quản Lý Đội Bóng</h1></header>

  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 class="page-title">Quản lý Cầu Thủ</h3>
      <a href="index.html" class="btn" style="background:transparent;color:var(--muted);border-radius:8px;padding:8px 12px;border:1px solid rgba(255,255,255,0.03);text-decoration:none">⟵ Trở về</a>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table id="playersTable" aria-live="polite">
          <thead>
            <tr><th style="width:12%">Mã</th><th style="width:40%">Tên</th><th style="width:20%">Vị trí</th><th style="width:12%">Số áo</th><th style="width:16%">Thao tác</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div style="height:18px"></div>

    <div class="panel">
      <h4 style="color:var(--accent);margin:0 0 12px">Thêm / Sửa cầu thủ</h4>
      <div class="form-row">
        <div class="col">
          <label class="sr">Mã</label>
          <input type="text" id="p_id" placeholder="Ví dụ: P001">
        </div>
        <div class="col">
          <label class="sr">Tên</label>
          <input type="text" id="p_name" placeholder="Tên cầu thủ">
        </div>
        <div class="col">
          <label class="sr">Vị trí</label>
          <select id="p_position">
            <option value="GK">GK - Thủ môn</option>
            <option value="DF">DF - Hậu vệ</option>
            <option value="MF">MF - Tiền vệ</option>
            <option value="FW">FW - Tiền đạo</option>
          </select>
        </div>
        <div class="col">
          <label class="sr">Số áo</label>
          <input type="number" id="p_number" placeholder="10">
          <div class="form-row" style="margin-top:14px">
  <div class="col">
    <label class="sr">Ngày sinh</label>
    <input type="date" id="p_dob">
  </div>
  <div class="col">
    <label class="sr">Chiều cao (cm)</label>
    <input type="number" id="p_height" placeholder="Ví dụ: 181">
  </div>
  <div class="col">
    <label class="sr">Cân nặng (kg)</label>
    <input type="number" id="p_weight" placeholder="Ví dụ: 78">
  </div>
</div>

        </div>
      </div>

      <div style="margin-top:14px">
        <button class="btn btn-primary" id="savePlayerBtn">Thêm</button>
        <button class="btn" id="clearPlayerBtn" style="margin-left:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)">Xoá form</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // init players page
    app.renderPlayers();
  </script>
</body>
</html>
